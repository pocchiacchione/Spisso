<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spisso</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-logo" width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="17" cy="17" r="17" fill="#1ed760"/>
        <path d="M9 21c5-2 11-2 16 1" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/>
        <path d="M10 16.5c4.5-2 9-2 13 0.5" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/>
        <path d="M11 12.5c3.5-1.4 7-1.4 10 0.3" stroke="#0b0b0b" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Spisso</span>
    </div>

    <nav class="nav">
      <a href="#" class="nav-item active" data-view="home">
        <span class="nav-icon">&#8962;</span> Home
      </a>
    </nav>

    <div class="sidebar-block library-block">
      <h3>La tua libreria</h3>
      <p id="library-count">— brani</p>
    </div>

    <div class="sidebar-block unlock-block">
      <h3>Hai un codice?</h3>
      <p>Sblocca un brano nascosto.</p>
      <form class="unlock-form" id="unlock-form">
        <input type="text" id="unlock-input" placeholder="Codice segreto" autocomplete="off">
        <button type="submit">Sblocca</button>
      </form>
      <p class="unlock-message" id="unlock-message"></p>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-nav">
        <button class="round-btn" disabled aria-label="Indietro">&#8249;</button>
        <button class="round-btn" disabled aria-label="Avanti">&#8250;</button>
      </div>
    </header>

    <section class="content">
      <div class="hero">
        <p class="hero-eyebrow">Brano del giorno</p>
        <h1 id="hero-title">—</h1>
        <button class="hero-play" id="hero-play" aria-label="Riproduci il brano del giorno">&#9658; Riproduci</button>
      </div>

      <h2 class="section-title">Tutti i brani</h2>
      <div class="song-grid" id="song-grid"></div>
    </section>
  </main>

</div>

<footer class="player-bar" id="player-bar">
  <div class="np">
    <img id="np-cover" src="covers/default-cover.svg" alt="">
    <div class="np-info">
      <div class="np-title" id="np-title">Nessun brano in riproduzione</div>
      <div class="np-date" id="np-date"></div>
    </div>
  </div>

  <div class="transport">
    <div class="transport-buttons">
      <button id="prev-btn" class="ctrl-btn" aria-label="Precedente">&#9198;</button>
      <button id="play-btn" class="ctrl-btn play" aria-label="Play/Pausa">&#9658;</button>
      <button id="next-btn" class="ctrl-btn" aria-label="Successivo">&#9197;</button>
    </div>
    <div class="progress-row">
      <span class="time" id="cur-time">0:00</span>
      <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
      <span class="time" id="dur-time">0:00</span>
    </div>
  </div>

  <div class="volume-control">
    <span class="volume-icon">&#128266;</span>
    <input type="range" id="volume-bar" min="0" max="100" value="80">
  </div>
</footer>

<audio id="audio-el" preload="metadata"></audio>

<script src="config.js"></script>
<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
