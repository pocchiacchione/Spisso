<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Salento 104.5 — Lettore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">

  <header class="station-header">
    <svg class="dial" width="44" height="44" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="28" cy="28" r="26" stroke="#e8703f" stroke-width="2.5"/>
      <circle cx="28" cy="28" r="3" fill="#e8703f"/>
      <line x1="28" y1="28" x2="42" y2="16" stroke="#f3e6d0" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <h1 class="station-name" style="font-size:1.2rem;">Radio Salento</h1>
      <p class="frequency">104.5 FM</p>
    </div>
  </header>

  <div class="player-card">
    <h2 class="player-title" id="song-title">Caricamento...</h2>

    <div class="transport">
      <button id="play-pause-btn" aria-label="Play/Pausa">&#9658;</button>
      <div class="seek-row">
        <span class="time" id="current-time">0:00</span>
        <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
        <span class="time" id="duration-time">0:00</span>
      </div>
    </div>

    <div class="volume-row">
      <span>Volume</span>
      <input type="range" id="volume-bar" min="0" max="100" value="80">
    </div>

    <div class="meta-row">
      <span>Aggiunta il <span id="song-date">—</span></span>
    </div>

    <div class="actions">
      <a class="btn back" href="index.html">&larr; Torna alla home</a>
      <a class="btn youtube" id="youtube-link" href="#" target="_blank" rel="noopener">Guarda su YouTube</a>
    </div>
  </div>

</div>

<div id="yt-container" class="hidden-player"><div id="yt-player"></div></div>

<script src="songs.js"></script>
<script src="locked-songs.js"></script>
<script src="player.js"></script>
</body>
</html>
